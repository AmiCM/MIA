services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      CHROMA_DIR: /srv/chroma
    volumes:
      - ./chroma:/srv/chroma
    ports: ["8000:8000"]
  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
